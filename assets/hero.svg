<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 236" width="814" role="img" aria-labelledby="t d">
<title id="t">Woobeen Back</title>
<desc id="d">I make LLMs run well on small devices. Key numbers: 20.51 tokens per second for a 7B mixture-of-experts model on a 2021 phone CPU; Product Hunt Product of the Week number 3 for the Ollie on-device AI app; 13 AI and data competition awards.</desc>
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#24292f}
